name: macOS Release

# Builds the Tkinter GUI + faster-whisper engine into an Apple Silicon
# PyInstaller bundle and publishes it as yt-transcript-macos-arm64.tar.gz.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-windows-cpu.txt

      - name: Build GUI + engine (onedir, CPU-only)
        run: |
          pyinstaller \
            --onedir --windowed \
            --name yt-transcript \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all yt_dlp \
            --hidden-import pystray \
            --hidden-import pystray._darwin \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --exclude-module hf_xet \
            --exclude-module torch \
            --exclude-module whisper \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            yt_transcript_gui.py

      - name: Stage release directory
        run: |
          mkdir -p release/yt-transcript-macos-arm64
          cp -R dist/yt-transcript.app release/yt-transcript-macos-arm64/
          cp README.md release/yt-transcript-macos-arm64/README.md

      - name: Package release tarball
        run: |
          tar -czf yt-transcript-macos-arm64.tar.gz -C release yt-transcript-macos-arm64
          du -h yt-transcript-macos-arm64.tar.gz

      - name: Check macOS artifact shape
        run: |
          ls -la dist
          test -d dist/yt-transcript.app
          tar -tzf yt-transcript-macos-arm64.tar.gz
          tar -tzf yt-transcript-macos-arm64.tar.gz | grep -qx 'yt-transcript-macos-arm64/yt-transcript.app/'

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated build."
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            yt-transcript-macos-arm64.tar.gz
