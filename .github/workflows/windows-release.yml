name: Windows Release

# Builds the Tkinter GUI + faster-whisper engine into a single PyInstaller
# bundle, optimized for size, and publishes it as yt-transcript-windows.zip —
# the asset the in-app self-updater downloads. Triggered by a v* tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-windows.txt

      - name: Build GUI + engine (onedir, size-optimized)
        run: |
          pyinstaller `
            --onedir --windowed `
            --name yt-transcript `
            --icon electron/build/icon.ico `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all yt_dlp `
            --hidden-import pystray `
            --hidden-import pystray._win32 `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --exclude-module hf_xet `
            --exclude-module torch `
            --exclude-module whisper `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            yt_transcript_gui.py

      - name: Strip unused native libs (tray-icon-only PIL)
        shell: pwsh
        run: |
          # Do NOT strip av.libs: PyAV >= 17 (ffmpeg 8) hard-links every codec
          # DLL from _core.pyd/avcodec (verified via PE import closure), so
          # deleting any of them breaks `import av` with "DLL load failed
          # while importing _core" (the v2.3.0/v2.3.1 regression).
          # Pillow is only used to draw the tray icon — drop unused image codecs.
          $pil = "dist/yt-transcript/_internal/PIL"
          if (Test-Path $pil) {
            foreach ($p in @("_avif*","_webp*","_imagingcms*","_imagingft*")) {
              Get-ChildItem $pil -Filter $p -ErrorAction SilentlyContinue | Remove-Item -Force
            }
          }

      - name: Stage README alongside the app
        shell: pwsh
        run: |
          Copy-Item README.md "dist/yt-transcript/README.md"

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/yt-transcript/*" `
            -DestinationPath "yt-transcript-windows.zip" `
            -CompressionLevel Optimal -Force
          "{0:N1} MB  yt-transcript-windows.zip" -f ((Get-Item yt-transcript-windows.zip).Length/1MB)

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --title $env:GITHUB_REF_NAME `
              --notes "Automated build. Download yt-transcript-windows.zip, extract, and run yt-transcript.exe. The app self-updates from future releases." *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
            }
          }
          gh release upload $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --clobber `
            yt-transcript-windows.zip
