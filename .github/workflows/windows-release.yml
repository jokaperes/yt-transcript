name: Windows Release

# Builds the Tkinter GUI + faster-whisper engine into a single PyInstaller
# bundle, optimized for size, and publishes it as yt-transcript-windows.zip —
# the asset the in-app self-updater downloads. Triggered by a v* tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-windows.txt

      - name: Build GUI + engine (onedir, size-optimized)
        run: |
          pyinstaller `
            --onedir --windowed `
            --name yt-transcript `
            --icon electron/build/icon.ico `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --hidden-import yt_dlp `
            --hidden-import pystray `
            --hidden-import pystray._win32 `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --exclude-module hf_xet `
            --exclude-module torch `
            --exclude-module whisper `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            yt_transcript_gui.py

      - name: Strip unused ffmpeg video/image encoders (audio decode only)
        shell: pwsh
        run: |
          $avlibs = "dist/yt-transcript/_internal/av.libs"
          if (Test-Path $avlibs) {
            $patterns = @("libx265*","libSvtAv1Enc*","libx264*","libvpx*","libdav1d*","libopenh264*","libwebp*","libvorbisenc*","libaom*")
            foreach ($p in $patterns) {
              Get-ChildItem $avlibs -Filter $p -ErrorAction SilentlyContinue | Remove-Item -Force
            }
          }

      - name: Stage yt-dlp.exe and README alongside the app
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/yt-transcript/yt-dlp.exe"
          Copy-Item README.md "dist/yt-transcript/README.md"

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/yt-transcript/*" `
            -DestinationPath "yt-transcript-windows.zip" `
            -CompressionLevel Optimal -Force
          "{0:N1} MB  yt-transcript-windows.zip" -f ((Get-Item yt-transcript-windows.zip).Length/1MB)

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:GITHUB_REF_NAME `
            --notes "Automated build. Download yt-transcript-windows.zip, extract, and run yt-transcript.exe. The app self-updates from future releases." `
            yt-transcript-windows.zip
